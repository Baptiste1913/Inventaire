<svg xmlns="http://www.w3.org/2000/svg" width="145" height="49" viewBox="0 0 145 49">
  <!-- Contour U, conserve la capsule exacte 145 x 49.
       Bleu ciel à gauche, vert d'eau à droite, bleu canard
       affleurant en haut-droite et en bas-gauche. -->
  <defs>
    <clipPath id="capsule">
      <rect x=".2" y=".2" width="144.6" height="48.6" rx="24.3"/>
    </clipPath>
  </defs>
  <g clip-path="url(#capsule)">
    <rect width="73" height="49" fill="#52BCE6"/>
    <rect x="73" width="72" height="49" fill="#68BDB3"/>
    <!-- Anneau canard intérieur continu et régulier. -->
    <rect x="1.85" y="1.8" width="141.3" height="45.4" rx="22.7" fill="#047986"/>
    <!-- Décalage du canard jusqu'au bord supérieur, côté droit. -->
    <path d="M62 1.8 C75 1.2 83 0 95.5 -.7 H115 C124 0 133.5 3.4 138.7 10.9 C133.5 5.6 124.5 2.5 115 2.1 C91.5 1.7 77 1.8 62 1.8 Z" fill="#047986"/>
    <!-- Décalage inverse jusqu'au bord inférieur, côté gauche. -->
    <path d="M19.5 39.6 C25.4 44.8 36.2 47.5 50.7 47.1 L95 47.1 C85.7 48.1 75 49.4 61 49.4 H49.4 C34.1 49.4 24 45.7 19.5 39.6 Z" fill="#047986"/>
    <!-- Intérieur régulier : aucune déformation du bouton ni surépaisseur. -->
    <rect x="3.75" y="3.75" width="137.5" height="41.5" rx="20.75" fill="#FFFFFF"/>
  </g>
</svg>
