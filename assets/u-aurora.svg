<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680" preserveAspectRatio="none" aria-hidden="true">
 <defs>
  <radialGradient id="blue"><stop offset="0" stop-color="#53c0e9" stop-opacity=".68"/><stop offset=".35" stop-color="#53c0e9" stop-opacity=".41"/><stop offset=".72" stop-color="#53c0e9" stop-opacity=".13"/><stop offset="1" stop-color="#53c0e9" stop-opacity="0"/></radialGradient>
