<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680" preserveAspectRatio="none" aria-hidden="true">
 <defs>
  <radialGradient id="blue"><stop offset="0" stop-color="#53c0e9" stop-opacity=".68"/><stop offset=".35" stop-color="#53c0e9" stop-opacity=".41"/><stop offset=".72" stop-color="#53c0e9" stop-opacity=".13"/><stop offset="1" stop-color="#53c0e9" stop-opacity="0"/></radialGradient>
  <radialGradient id="deep"><stop offset="0" stop-color="#007583" stop-opacity=".52"/><stop offset=".38" stop-color="#007583" stop-opacity=".27"/><stop offset=".72" stop-color="#007583" stop-opacity=".08"/><stop offset="1" stop-color="#007583" stop-opacity="0"/></radialGradient>
  <radialGradient id="mint"><stop offset="0" stop-color="#64b9ae" stop-opacity=".65"/><stop offset=".36" stop-color="#64b9ae" stop-opacity=".37"/><stop offset=".75" stop-color="#64b9ae" stop-opacity=".09"/><stop offset="1" stop-color="#64b9ae" stop-opacity="0"/></radialGradient>
  <radialGradient id="red"><stop offset="0" stop-color="#e21b1b" stop-opacity=".32"/><stop offset=".42" stop-color="#e21b1b" stop-opacity=".13"/><stop offset="1" stop-color="#e21b1b" stop-opacity="0"/></radialGradient>
  <filter id="warp" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
   <feTurbulence type="fractalNoise" baseFrequency=".010 .014" numOctaves="2" seed="8" result="noise"/>
   <feDisplacementMap in="SourceGraphic" in2="noise" scale="25" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
   <feGaussianBlur in="displaced" stdDeviation="24"/>
  </filter>
 </defs>
 <style>
  /* V37.80 — Mouvement lent et léger des seuls halos, sans JavaScript.
     Le rendu fixe reste disponible sur Safari sans animation CSS SVG. */
  .iu-blue{animation:iu-drift-blue 37s ease-in-out infinite alternate;}
  .iu-mint{animation:iu-drift-mint 42s ease-in-out infinite alternate;}
  .iu-deep{animation:iu-drift-deep 46s ease-in-out infinite alternate;}
  .iu-red{animation:iu-drift-red 40s ease-in-out infinite alternate;}
  @keyframes iu-drift-blue{
   0%{transform:translate(0,0);}
   50%{transform:translate(16px,-11px);}
   100%{transform:translate(-11px,9px);}
  }
  @keyframes iu-drift-mint{
   0%{transform:translate(0,0);}
   50%{transform:translate(-17px,11px);}
   100%{transform:translate(10px,-10px);}
  }
  @keyframes iu-drift-deep{
   0%{transform:translate(0,0);}
   50%{transform:translate(12px,13px);}
   100%{transform:translate(-12px,-9px);}
  }
  @keyframes iu-drift-red{
   0%{transform:translate(0,0);opacity:.84;}
   50%{transform:translate(14px,-9px);opacity:1;}
   100%{transform:translate(-10px,9px);opacity:.82;}
  }
  @media (prefers-reduced-motion: reduce){
   .iu-blue,.iu-mint,.iu-deep,.iu-red{animation:none!important;}
  }
 </style>
 <g filter="url(#warp)">
  <ellipse class="iu-blue" cx="180" cy="315" rx="270" ry="250" fill="url(#blue)"/>
  <ellipse class="iu-mint" cx="500" cy="340" rx="270" ry="240" fill="url(#mint)"/>
  <ellipse class="iu-deep" cx="365" cy="410" rx="275" ry="260" fill="url(#deep)"/>
  <ellipse class="iu-red" cx="115" cy="396" rx="226" ry="197" fill="url(#red)"/>
 </g>
</svg>
