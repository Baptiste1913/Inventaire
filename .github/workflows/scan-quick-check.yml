name: Vérification scanner et pesée

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scan-quick-check.yml'
      - 'tools/test_scanner_transfer.cjs'
      - 'app.js'
      - 'weigh-scan.js'
      - 'gemini-lab.js'
      - 'gemini-transport.js'
      - 'tools/test_gemini_transport.cjs'
      - 'tools/test_gemini_resilience.cjs'
      - 'tools/test_digi_hypotheses.cjs'
      - 'gemini-latency.js'
      - 'gemini-litert-lab.js'
      - 'gemini-litert-worker.js'
      - 'tools/test_gemini_latency.cjs'
      - 'gemini-recognition-core.js'
      - 'gemini-paddle-lab.js'
      - 'gemini-paddle-worker.js'
      - 'tools/test_gemini_recognition_core.cjs'
      - 'gemini-parallel.js'
      - 'gemini-image-worker.js'
      - 'gemini-zxing.js'
      - 'vendor/zxing/**'
      - 'tools/test_zxing_primary.cjs'
      - 'tools/test_gemini_ean_distance.cjs'
      - 'tools/test_gemini_duplicate_dialog.cjs'
      - 'tools/test_gemini_parallel.cjs'
      - 'tools/test_gemini_worker_pixels.cjs'
      - 'gemini-ean.js'
      - 'gemini-ean-printed.js'
      - 'tools/test_gemini_ean_focus.cjs'
      - 'tools/test_gemini_ean_printed.cjs'
      - 'gemini-label-geometry.js'
      - 'tools/test_gemini_ean_rescue.cjs'
      - 'tools/test_gemini_label_geometry.cjs'
      - 'tools/test_gemini_label_detail.cjs'
      - 'gemini-frame-quality.js'
      - 'tools/test_gemini_frame_quality.cjs'
      - 'tools/test_gemini_capture_selection.cjs'
      - 'digi-catalog-lookup.js'
      - 'barcode-catalog.js'
      - 'tools/test_digi_catalog_lookup.cjs'
      - 'tools/test_digi_catalog_integration.cjs'
      - 'tools/test_digi_catalog_recovery.cjs'
      - 'gemini-local-ocr.js'
      - 'workers/coursesu-live-worker.js'
      - 'gemini-lab.css'
      - 'tools/test_gemini_manual_save.cjs'
      - 'tools/test_gemini_worker_only.mjs'
      - 'workers/coursesu-apify-worker.js'
      - 'tools/test_gemini_video_resume.cjs'
      - 'tools/test_gemini_single_photo.cjs'
      - 'tools/test_gemini_service_errors.cjs'
      - 'tools/test_gemini_worker_v2.mjs'
      - 'tools/test_gemini_auto_scan.cjs'
      - 'tools/test_gemini_local_ocr.cjs'
      - 'tools/test_gemini_alerts_and_duplicates.cjs'
      - 'tools/test_gemini_camera_lifecycle.cjs'
      - 'tools/test_gemini_double_border.cjs'
      - 'tools/test_gemini_inline_scan.cjs'
      - 'tools/test_gemini_compact_capture.cjs'
      - 'tools/test_gemini_label_glow.cjs'
      - 'tools/test_gemini_idle_layout.cjs'
      - 'weigh-scan-inline.css'
      - 'index.html'
      - 'sw.js'
      - 'version.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check app.js
          node --check weigh-scan.js
          node --check gemini-lab.js
          node --check gemini-transport.js
          node --check gemini-latency.js
          node --check gemini-litert-lab.js
          node --check gemini-litert-worker.js
          node --check gemini-recognition-core.js
          node --check gemini-paddle-lab.js
          node --check gemini-paddle-worker.js
          node --check tools/test_gemini_recognition_core.cjs
          node --check gemini-parallel.js
          node --check gemini-image-worker.js
          node --check gemini-zxing.js
          node --check tools/test_zxing_primary.cjs
          node --check tools/test_gemini_ean_distance.cjs
          node --check tools/test_gemini_duplicate_dialog.cjs
          node --check tools/test_gemini_parallel.cjs
          node --check tools/test_gemini_worker_pixels.cjs
          node --check gemini-ean.js
          node --check gemini-ean-printed.js
          node --check tools/test_gemini_ean_focus.cjs
          node --check tools/test_gemini_ean_printed.cjs
          node --check gemini-label-geometry.js
          node --check tools/test_gemini_ean_rescue.cjs
          node --check tools/test_gemini_label_geometry.cjs
          node --check tools/test_gemini_label_detail.cjs
          node --check gemini-frame-quality.js
          node --check tools/test_gemini_frame_quality.cjs
          node --check tools/test_gemini_capture_selection.cjs
          node --check digi-catalog-lookup.js
          node --check barcode-catalog.js
          node --check tools/test_digi_catalog_lookup.cjs
          node --check tools/test_digi_catalog_integration.cjs
          node --check tools/test_digi_catalog_recovery.cjs
          node --check gemini-local-ocr.js
          node --check workers/coursesu-live-worker.js
          node --check tools/test_gemini_worker_only.mjs
          node --check workers/coursesu-apify-worker.js
          node --check tools/test_gemini_video_resume.cjs
          node --check tools/test_gemini_single_photo.cjs
          node --check tools/test_gemini_service_errors.cjs
          node --check tools/test_gemini_worker_v2.mjs
          node --check tools/test_gemini_manual_save.cjs
          node --check tools/test_gemini_auto_scan.cjs
          node --check tools/test_gemini_local_ocr.cjs
          node --check tools/test_gemini_alerts_and_duplicates.cjs
          node --check tools/test_gemini_camera_lifecycle.cjs
          node --check tools/test_gemini_double_border.cjs
          node --check tools/test_gemini_inline_scan.cjs
          node --check tools/test_gemini_compact_capture.cjs
          node --check tools/test_gemini_label_glow.cjs
          node --check tools/test_gemini_idle_layout.cjs
          node --check sw.js
          node --check tools/test_scanner_transfer.cjs
      - name: Vérifier les identités DIGI sans appel facturé
        run: |
          node tools/test_digi_catalog_lookup.cjs
          node tools/test_digi_catalog_integration.cjs
          node tools/test_digi_catalog_recovery.cjs
          node tools/test_gemini_transport.cjs
          node tools/test_gemini_resilience.cjs
          node tools/test_digi_hypotheses.cjs
          node tools/test_gemini_latency.cjs
          node tools/test_gemini_recognition_core.cjs
      - name: Vérifier la sécurité et les routes du Worker Gemini dédié
        run: node tools/test_gemini_worker_only.mjs
      - name: Vérifier la lecture Gemini renforcée à partir d’une seule photo
        run: |
          node tools/test_gemini_single_photo.cjs
          node tools/test_gemini_service_errors.cjs
      - name: Vérifier les validations Gemini et les images structurées
        run: node tools/test_gemini_worker_v2.mjs
      - name: Vérifier la reprise caméra iPhone sans bandes noires après lecture
        run: node tools/test_gemini_video_resume.cjs
      - name: Confirmer le décodage EAN-13 et la géométrie de l'étiquette
        run: |
          node tools/test_gemini_ean_rescue.cjs
          node tools/test_gemini_label_geometry.cjs
          node tools/test_gemini_label_detail.cjs
      - name: Tester EAN en parallèle et CLAHE en secours (sans API facturée)
        run: |
          node tools/test_gemini_parallel.cjs
          node tools/test_zxing_primary.cjs
          node tools/test_gemini_ean_distance.cjs
          node tools/test_gemini_duplicate_dialog.cjs
          node tools/test_gemini_worker_pixels.cjs
          node tools/test_gemini_ean_focus.cjs
          node tools/test_gemini_ean_printed.cjs
      - name: Vérifier la photo optimale et les 3 zones DIGI
        run: |
          node tools/test_gemini_frame_quality.cjs
          node tools/test_gemini_capture_selection.cjs
      - name: Vérifier le transfert OCR et le calcul de tare
        run: node tools/test_scanner_transfer.cjs
      - name: Vérifier la validation manuelle Gemini
        run: node tools/test_gemini_manual_save.cjs
      # Les tests v41 du mode auto/réinitialisation vérifient des boutons
      # retirés volontairement du scanner v42. Ils restent dans tools/
      # mais ne doivent plus bloquer les validations des parcours actifs.
      - name: Vérifier la lecture OCR locale prudente
        run: node tools/test_gemini_local_ocr.cjs
      # Les tests DOM v41 (alertes, contour, inline, bouton compact,
      # halos et repère) seront réécrits si ces vues changent.
      # Couverture actuelle : Gemini v2, catalogue, validation, caméra,
      # EAN, OCR local et transfert de pesée.
