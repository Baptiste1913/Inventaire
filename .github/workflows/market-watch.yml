name: Veille officielle Fruits et Legumes
on:
  push:
    paths:
      - 'tools/market_watch.py'
      - '.github/workflows/market-watch.yml'
  schedule:
    - cron: '18 5,11,17 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-watch
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Collecte des sources officielles
        run: python3 tools/market_watch.py
      - name: Mise a jour du fichier de veille
        run: |
          if git diff --quiet -- market-watch.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-watch.json
          git commit -m "data: actualiser la veille F&L"
          git pull --rebase origin main
          git push origin HEAD:main
